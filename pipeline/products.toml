# What this repository publishes: the night sky — the stars a naked eye sees, their names, the
# constellations' figures, the Milky Way's outline and the Messier objects (`sky`); the comets
# bright enough to see in the coming month (`comets`), daily; and the International Space Station's
# path for the coming fortnight, from NASA Johnson Space Center's ephemeris (`station`), daily; and the major
# meteor showers, from the IAU Meteor Data Center and IMO's calendar (`meteors`); and Earth
# satellites' elements from CelesTrak (`satellites`). The fetcher is the site's
# `scripts/fetch-sky.py` and the contract its `scripts/check-sky.py`: none of these is a file the
# website's map reads, so `test-schema.mjs` does not describe them.

[contract]
check = ["python3", "scripts/check-sky.py"]
roots = ["python3", "scripts/check-sky.py", "--roots"]

[defaults]
timeout_minutes = 20

[steps.sky]
cmd = ["python3", "scripts/fetch-sky.py", "--only=sky"]
lane = "cdsarc.cds.unistra.fr"

[steps.comets]
cmd = ["python3", "scripts/fetch-sky.py", "--only=comets"]
lane = "www.minorplanetcenter.net"

[products.sky]
title = "The night sky: stars to V 6.5, their names, the constellations, the Milky Way, the Messier objects"
step = "sky"
roots = ["sky.json", "stars-1.json", "constellations.json", "milkyway.json", "deepsky.json"]
writes = ["sky.json", "stars-1.json", "constellations.json", "milkyway.json", "deepsky.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=sky"]

[products.comets]
title = "Comets bright enough to see in the coming month (IAU Minor Planet Center)"
step = "comets"
roots = ["comets.json"]
writes = ["comets.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=comets"]
max_age_hours = 50

[steps.station]
cmd = ["python3", "scripts/fetch-sky.py", "--only=station"]
lane = "nasa-public-data.s3.amazonaws.com"

[products.station]
title = "The International Space Station's path, the coming fortnight (NASA Johnson Space Center)"
step = "station"
roots = ["station.json"]
writes = ["station.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=station"]
max_age_hours = 50

[steps.meteors]
cmd = ["python3", "scripts/fetch-sky.py", "--only=meteors"]
lane = "www.ta3.sk"

[products.meteors]
title = "The major meteor showers: radiants, dates and speeds (IAU Meteor Data Center), rates (International Meteor Organization)"
step = "meteors"
roots = ["meteors.json"]
writes = ["meteors.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=meteors"]
max_age_hours = 50

[steps.satellites]
cmd = ["python3", "scripts/fetch-sky.py", "--only=satellites"]
lane = "celestrak.org"

[products.satellites]
title = "Earth satellites' elements: the space stations, the brightest and every Starlink (CelesTrak, from the US Space Force's catalog)"
step = "satellites"
roots = ["satellites.json", "starlink.json"]
writes = ["satellites.json", "starlink.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=satellites"]
max_age_hours = 6
