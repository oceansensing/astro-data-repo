# What this repository publishes: the night sky — the stars to V 9 in three bands, their names,
# the constellations' figures and the Milky Way's outline (`sky`); the NGC and IC objects, the Messier
# objects among them, and the nebulae beyond the NGC (`deepsky`); the brightest sources of nine
# catalogs, gamma rays to radio (`sources`) — these three weekly; the comets bright enough to see in
# the coming month (`comets`), the International Space Station's path for the coming fortnight, from
# NASA Johnson Space Center's ephemeris (`station`), and the major meteor showers, from the IAU Meteor
# Data Center and IMO's calendar (`meteors`), daily; and Earth satellites' elements from CelesTrak
# (`satellites`), every two hours — each step at its own interval under one schedule (`every_hours`).
# The fetcher is the site's `scripts/fetch-sky.py` and the contract its `scripts/check-sky.py`: none
# of these is a file the website's map reads, so `test-schema.mjs` does not describe them.

[contract]
check = ["python3", "scripts/check-sky.py"]
roots = ["python3", "scripts/check-sky.py", "--roots"]

# The sky's pictures across the spectrum, gamma rays to radio, committed under map/spectrum/ by
# hand (the site's scripts/make-spectrum.py), and the bodies' surface maps under map/bodies/ (the
# site's scripts/make-bodies.py, 2026-10-07) — copied into every publish by assemble, which refuses
# to run when they are absent.
[static]
required = ["spectrum", "bodies"]

[defaults]
timeout_minutes = 20

[steps.sky]
cmd = ["python3", "scripts/fetch-sky.py", "--only=sky"]
lane = "cdsarc.cds.unistra.fr"
every_hours = 166

[steps.deepsky]
cmd = ["python3", "scripts/fetch-sky.py", "--only=deepsky"]
lane = "query.wikidata.org"
every_hours = 166

[steps.sources]
cmd = ["python3", "scripts/fetch-sky.py", "--only=sources"]
lane = "heasarc.gsfc.nasa.gov"
every_hours = 166

[steps.comets]
cmd = ["python3", "scripts/fetch-sky.py", "--only=comets"]
lane = "www.minorplanetcenter.net"
every_hours = 22

[products.sky]
title = "The night sky: stars to V 9 in three bands, their names, the constellations, the Milky Way"
step = "sky"
roots = ["sky.json", "stars-1.json", "stars-2.json", "stars-3.json", "constellations.json", "milkyway.json"]
writes = ["sky.json", "stars-1.json", "stars-2.json", "stars-3.json", "constellations.json", "milkyway.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=sky"]

[products.deepsky]
title = "The deep sky: the NGC and IC objects, the Messier objects among them, and the nebulae beyond the NGC (OpenNGC, CC BY-SA 4.0; Barnard, Lynds and Sharpless through CDS; names from Wikidata)"
step = "deepsky"
roots = ["deepsky.json", "ngc.json", "nebulae.json"]
writes = ["deepsky.json", "ngc.json", "nebulae.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=deepsky"]
max_age_hours = 400

[products.sources]
title = "What each band sees: the brightest sources of nine catalogs, gamma rays to radio (NASA HEASARC, CSIRO CASDA)"
step = "sources"
roots = ["sources.json"]
writes = ["sources.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=sources"]
max_age_hours = 400

[products.comets]
title = "Comets bright enough to see in the coming month (IAU Minor Planet Center)"
step = "comets"
roots = ["comets.json"]
writes = ["comets.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=comets"]
max_age_hours = 50

[steps.station]
cmd = ["python3", "scripts/fetch-sky.py", "--only=station"]
lane = "nasa-public-data.s3.amazonaws.com"
every_hours = 22

[products.station]
title = "The International Space Station's path, the coming fortnight (NASA Johnson Space Center)"
step = "station"
roots = ["station.json"]
writes = ["station.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=station"]
max_age_hours = 50

[steps.meteors]
cmd = ["python3", "scripts/fetch-sky.py", "--only=meteors"]
lane = "www.ta3.sk"
every_hours = 22

[products.meteors]
title = "The major meteor showers: radiants, dates and speeds (IAU Meteor Data Center), rates (International Meteor Organization)"
step = "meteors"
roots = ["meteors.json"]
writes = ["meteors.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=meteors"]
max_age_hours = 50

[steps.satellites]
cmd = ["python3", "scripts/fetch-sky.py", "--only=satellites"]
lane = "celestrak.org"
every_hours = 1.5

[products.satellites]
title = "Earth satellites' elements: the space stations, the brightest and every Starlink (CelesTrak, from the US Space Force's catalog)"
step = "satellites"
roots = ["satellites.json", "starlink.json"]
writes = ["satellites.json", "starlink.json"]
namespace = ["python3", "scripts/fetch-sky.py", "--namespace", "--only=satellites"]
max_age_hours = 6
